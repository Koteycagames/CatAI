<!DOCTYPE html>
<html lang="ru" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CatAI Interface</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Сброс стилей для списков */
        ul, li { list-style: none !important; margin: 0; padding: 0; }
        /* Прячем стрелки select */
        select { -webkit-appearance: none; -moz-appearance: none; appearance: none; }
        /* Скроллбары */
        #chat-messages::-webkit-scrollbar { width: 8px; }
        #chat-messages::-webkit-scrollbar-track { background: #2d3748; }
        #chat-messages::-webkit-scrollbar-thumb { background-color: #4a5568; border-radius: 20px; }
        #chat-history-list::-webkit-scrollbar { width: 6px; }
        #chat-history-list::-webkit-scrollbar-track { background: #1a202c; }
        #chat-history-list::-webkit-scrollbar-thumb { background-color: #4a5568; border-radius: 20px; }
        /* Курсор при печати */
        .typing-cursor {
            display: inline-block; width: 2px; height: 1em; background-color: white;
            animation: blink 1s step-end infinite; vertical-align: middle;
        }
        @keyframes blink { 50% { opacity: 0; } }
    </style>
</head>

                    Новый чат <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6v6m0 0v6m0-6h6m-6 0H6"/></svg>

                    <svg class="h-5 w-5 mr-2" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M5 2a1 1 0 00-1 1v1h1a1 1 0 010 2H4v1a1 1 0 001 1h2a1 1 0 011 1v2a1 1 0 001-1V9a1 1 0 011-1h2a1 1 0 001-1V6h-1a1 1 0 110-2h1V3a1 1 0 00-1-1H5zM2 13v3a1 1 0 001 1h3a1 1 0 001-1v-3a1 1 0 00-1-1H3a1 1 0 00-1 1zm14 0v3a1 1 0 001 1h3a1 1 0 001-1v-3a1 1 0 00-1-1h-3a1 1 0 00-1 1z" clip-rule="evenodd"/></svg> Модели

                        <label class="flex items-center p-3 rounded bg-gray-700 cursor-pointer"><input name="model-selection" type="radio" value="fast" class="mr-3"> Fast (Free)</label>
                        <label class="flex items-center p-3 rounded bg-gray-700 cursor-pointer"><input name="model-selection" type="radio" value="pro" class="mr-3"> PRO (Paid)</label>

                        <label class="bg-gray-700 p-2 rounded text-center cursor-pointer text-sm"><input name="limit-selection" type="radio" value="5k" class="sr-only">5k</label>

    <div id="admin-modal" class="page hidden fixed inset-0 z-50 overflow-y-auto">
        <div class="flex items-end justify-center min-h-screen px-4 pt-4 pb-20 sm:block sm:p-0 text-center">
            <div class="fixed inset-0 bg-gray-900 bg-opacity-75" id="admin-modal-backdrop"></div>
            <span class="hidden sm:inline-block sm:align-middle sm:h-screen">&#8203;</span>
            <div class="inline-block align-bottom bg-gray-800 rounded-lg text-left overflow-hidden shadow-xl transform transition-all sm:align-middle sm:max-w-2xl sm:w-full">
                <div class="p-6">
                    <h3 class="text-lg font-medium text-white mb-4">Запросы</h3>
                    <div id="admin-requests-list" class="space-y-3 max-h-96 overflow-y-auto"></div>
                    <div class="mt-4 flex justify-end"><button id="close-admin-modal-btn" class="bg-gray-700 px-4 py-2 rounded text-white">Закрыть</button></div>

<script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.15.0/firebase-app.js";
        import { getAuth, onAuthStateChanged, createUserWithEmailAndPassword, signInWithEmailAndPassword, signOut } from "https://www.gstatic.com/firebasejs/9.15.0/firebase-auth.js";
        import { getDatabase, ref, onValue, push, set, serverTimestamp, update, off, get } from "https://www.gstatic.com/firebasejs/9.15.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCcgLac2riawIGPHsdkXLOeFTEY_TUZX_s",
            authDomain: "catai-1624d.firebaseapp.com",
            databaseURL: "https://catai-1624d-default-rtdb.firebaseio.com",
            projectId: "catai-1624d",
            storageBucket: "catai-1624d.firebasestorage.app",
            messagingSenderId: "565260079109",
            appId: "1:565260079109:web:fd10c337a424555c0b0c6c"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getDatabase(app);

        const pages = document.querySelectorAll('.page');
        const loginForm = document.getElementById('login-form');
        const registerForm = document.getElementById('register-form');
        const chatHistoryList = document.getElementById('chat-history-list');
        const chatMessages = document.getElementById('chat-messages');
        const chatForm = document.getElementById('chat-form');
        const chatInput = document.getElementById('chat-input');
        const typingIndicator = document.getElementById('typing-indicator');
        
        let currentUserId = null;
        let isAdmin = false;
        let userChatsData = {};
        let currentActiveChatId = null;
        let knowledgeBase = {};
        let subscriptionStatus = { status: 'none' };
        
        const thinkingPhrases = ["Анализирую контекст...", "Проверяю базу знаний...", "Формирую структуру...", "Уточняю детали...", "Оптимизирую ответ..."];

        // ==========================================================
        // === 1. УМНЫЙ ПОИСК (МАТЕМАТИКА + ЛЕВЕНШТЕЙН) ===
        // ==========================================================
        
        // Эти слова мы стараемся игнорировать, чтобы искать СУТЬ.
        const STOP_WORDS = [
            'как', 'сделать', 'приготовить', 'сварить', 'пожарить', 'зажарить', 
            'рецепт', 'способ', 'метод',
            'что', 'такое', 'зачем', 'нужен', 'почему', 'для', 'чего', 'какой',
            'быстро', 'вкусно', 'дома', 'самому'
        ];

        function cleanString(str) {
            return str.toLowerCase().trim().replace(/[\?\!\.\,\(\)\-\:]/g, '');
        }

        // Алгоритм Левенштейна (считает разницу в буквах)
        function levenshtein(a, b) {
            if (a.length === 0) return b.length;
            if (b.length === 0) return a.length;
            const matrix = [];
            for (let i = 0; i <= b.length; i++) matrix[i] = [i];
            for (let j = 0; j <= a.length; j++) matrix[0][j] = j;
            for (let i = 1; i <= b.length; i++) {
                for (let j = 1; j <= a.length; j++) {
                    const cost = (b.charAt(i - 1) === a.charAt(j - 1)) ? 0 : 1;
                    matrix[i][j] = Math.min(matrix[i - 1][j - 1] + cost, matrix[i][j - 1] + 1, matrix[i - 1][j] + 1);
                }
            }
            return matrix[b.length][a.length];
        }

        function findBestMatch(userInput, db) {
            const cleanInput = cleanString(userInput);
            // Разбиваем запрос на слова
            const inputWords = cleanInput.split(' ').filter(w => w.length > 0);
            
            let bestMatch = null;
            let bestScore = -100;

            for (const key in db) {
                const cleanKey = cleanString(key);
                const keyWords = cleanKey.split(' '); // Слова из базы
                
                let currentScore = 0;
                let matchedWordsCount = 0;

                // --- ГЛАВНАЯ МАГИЯ ---
                // Мы сравниваем КАЖДОЕ слово запроса с КАЖДЫМ словом ключа
                
                inputWords.forEach(inWord => {
                    // Если это стоп-слово, даем ему очень маленький вес
                    const isStopWord = STOP_WORDS.includes(inWord);
                    let bestWordMatchScore = 0;

                    keyWords.forEach(keyWord => {
                        let score = 0;

                        // 1. Точное совпадение
                        if (inWord === keyWord) {
                            score = 1.0; 
                        }
                        // 2. Начало слова совпадает ("сдел" -> "сделать")
                        else if (keyWord.startsWith(inWord) && inWord.length >= 3) {
                            score = 0.9; 
                        }
                        // 3. Опечатки (Левенштейн)
                        else {
                            const dist = levenshtein(inWord, keyWord);
                            const maxLen = Math.max(inWord.length, keyWord.length);
                            // Если слово длинное (борщ), допускаем 1 ошибку. Если короткое - 0.
                            if (maxLen > 3 && dist <= 1) score = 0.8; // "сделкть" -> "сделать"
                            else if (maxLen > 5 && dist <= 2) score = 0.7;
                        }

                        if (score > bestWordMatchScore) bestWordMatchScore = score;
                    });

                    // Если это НЕ стоп-слово, оно очень важное (умножаем очки)
                    if (!isStopWord) {
                        currentScore += bestWordMatchScore * 2.0; // Вес важных слов
                    } else {
                        currentScore += bestWordMatchScore * 0.5; // Вес стоп-слов
                    }
                    
                    if (bestWordMatchScore > 0.5) matchedWordsCount++;
                });

                // Штраф за лишние слова в ключе (чтобы "борщ" не путался с "борщ с пампушками и водкой")
                // Но штраф небольшой
                const lengthDiff = Math.abs(inputWords.length - keyWords.length);
                currentScore -= lengthDiff * 0.1;

                if (currentScore > bestScore) {
                    bestScore = currentScore;
                    bestMatch = key;
                }
            }
            
            // Отладка в консоль (F12), чтобы ты видел, как он думает
            console.log(`Input: "${userInput}" | Match: "${bestMatch}" | Score: ${bestScore.toFixed(2)}`);
            
            // Порог уверенности.
            // Если совпало хотя бы одно важное слово (2.0) минус штрафы -> ~1.5
            if (bestScore > 1.3) return db[bestMatch];
            
            return null;
        }

        // ==========================================================
        
        // --- 2. ЗАГРУЗКА (ANTI-CACHE) ---
        async function loadKnowledgeBase() {
            const files = ['chat.json', 'cooking.json', 'technics.json', 'programm.json'];
            knowledgeBase = {};
            const ts = new Date().getTime();
            for (const file of files) {
                try {
                    const response = await fetch(file + '?v=' + ts);
                    if (!response.ok) continue;
                    const data = await response.json();
                    for (let key in data) knowledgeBase[key.toLowerCase().trim()] = data[key];
                } catch (e) { console.error(e); }
            }
        }

        // --- 3. ROUTING ---
        function updateView() {
            const hash = window.location.hash || (currentUserId ? '#ai' : '#login');
            pages.forEach(p => p.classList.add('hidden'));
            if (hash === '#ai' && currentUserId) document.querySelector('#ai').classList.remove('hidden');
            else if (hash === '#models') { document.querySelector('#ai').classList.remove('hidden'); document.getElementById('models-modal').classList.remove('hidden'); }
            else if (hash === '#admin' && isAdmin) { document.querySelector('#ai').classList.remove('hidden'); document.getElementById('admin-modal').classList.remove('hidden'); }
            else if (hash === '#register') document.querySelector('#register').classList.remove('hidden');
            else document.querySelector('#login').classList.remove('hidden');
        }
        window.addEventListener('hashchange', updateView);

        // --- 4. AUTH ---
        onAuthStateChanged(auth, async (user) => {
            currentUserId = user ? user.uid : null;
            if (user) {
                isAdmin = (user.email === 'admin@gmail.com');
                document.getElementById('admin-panel-btn').classList.toggle('hidden', !isAdmin);
                await loadKnowledgeBase();
                setupChatListeners(user.uid);
                setupSubscriptionListener(user.uid);
                if(isAdmin) setupAdminListeners();
                if(!window.location.hash || window.location.hash === '#login') window.location.hash = '#ai';
            } else {
                window.location.hash = '#login';
                chatHistoryList.innerHTML = '';
                chatMessages.innerHTML = '';
            }
            updateView();
        });

        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            try { await signInWithEmailAndPassword(auth, document.getElementById('login-email').value, document.getElementById('login-password').value); } 
            catch (e) { document.getElementById('login-error').textContent = e.code === 'auth/wrong-password' ? 'Неверный пароль' : e.message; }
        });
        registerForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            if(document.getElementById('register-password').value !== document.getElementById('register-password-confirm').value) return alert('Пароли не совпадают');
            try { await createUserWithEmailAndPassword(auth, document.getElementById('register-email').value, document.getElementById('register-password').value); window.location.hash = '#login'; } 
            catch (e) { document.getElementById('register-error').textContent = e.message; }
        });
        document.getElementById('logout-btn').addEventListener('click', () => signOut(auth));

        // --- 5. CHAT & ANIMATION ---
        function setupChatListeners(uid) {
            onValue(ref(db, `users/${uid}/chats`), (snap) => {
                userChatsData = snap.val() || {};
                renderSidebar(userChatsData);
                if (currentActiveChatId && userChatsData[currentActiveChatId]) renderChat(userChatsData[currentActiveChatId]);
                else if (!currentActiveChatId && Object.keys(userChatsData).length > 0) { currentActiveChatId = Object.keys(userChatsData)[0]; renderChat(userChatsData[currentActiveChatId]); }
                else if (!Object.keys(userChatsData).length) createNewChat();
            });
        }

        async function createNewChat() {
            if(!currentUserId) return;
            const newRef = push(ref(db, `users/${currentUserId}/chats`));
            await set(newRef, { title: 'Новый чат', createdAt: serverTimestamp(), messages: [] });
            push(ref(db, `users/${currentUserId}/chats/${newRef.key}/messages`), {role: 'ai', content: 'Привет! Я CatAI.'});
            currentActiveChatId = newRef.key;
        }

        function renderSidebar(data) {
            chatHistoryList.innerHTML = '';
            Object.entries(data).forEach(([id, chat]) => {
                const li = document.createElement('li');
                const a = document.createElement('a');
                a.href = '#';
                a.textContent = chat.title || 'Чат';
                a.className = `block w-full text-left px-3 py-2 text-sm rounded-md truncate transition ${id === currentActiveChatId ? 'bg-gray-800 text-white' : 'text-gray-400 hover:bg-gray-800'}`;
                a.onclick = (e) => { e.preventDefault(); currentActiveChatId = id; renderSidebar(userChatsData); };
                li.appendChild(a);
                chatHistoryList.appendChild(li);
            });
        }

        function renderChat(chat) {
            chatMessages.innerHTML = '';
            if(!chat || !chat.messages) return;
            Object.values(chat.messages).forEach(msg => appendMessageToUI(msg.role, msg.content));
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        function appendMessageToUI(role, content) {
            const isUser = role === 'user';
            const div = document.createElement('div');
            div.className = 'flex items-start space-x-4 mb-4';
            div.innerHTML = `
                <div class="flex-shrink-0 w-10 h-10 rounded-full ${isUser ? 'bg-indigo-600' : 'bg-blue-600'} flex items-center justify-center text-white font-bold">${isUser?'U':'C'}</div>
                <div class="flex-1 min-w-0">
                    <p class="font-bold text-white">${isUser ? 'Вы' : 'CatAI'}</p>
                    <div class="mt-1 text-gray-300 whitespace-pre-wrap break-words message-content">${content}</div>
                </div>`;
            chatMessages.appendChild(div);
            return div;
        }

        function typeWriter(element, text, speed) {
            return new Promise(resolve => {
                let i = 0;
                element.innerHTML = '<span class="typing-cursor"></span>';
                function type() {
                    if (i < text.length) {
                        const char = text.charAt(i);
                        let currentHTML = element.innerHTML.replace('<span class="typing-cursor"></span>', '');
                        if (char === '<') {
                            let tag = '';
                            while (text.charAt(i) !== '>' && i < text.length) { tag += text.charAt(i); i++; }
                            tag += '>'; i++;
                            currentHTML += tag;
                        } else { currentHTML += char; i++; }
                        element.innerHTML = currentHTML + '<span class="typing-cursor"></span>';
                        chatMessages.scrollTop = chatMessages.scrollHeight;
                        setTimeout(type, speed);
                    } else {
                        element.innerHTML = element.innerHTML.replace('<span class="typing-cursor"></span>', '');
                        resolve();
                    }
                }
                type();
            });
        }

        // --- 6. MAIN HANDLER ---
        chatForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const txt = chatInput.value.trim();
            if(!txt || !currentActiveChatId) return;
            const cid = currentActiveChatId;
            const model = document.getElementById('model-select').value;
            chatInput.value = '';

            await push(ref(db, `users/${currentUserId}/chats/${cid}/messages`), { role: 'user', content: txt });
            const msgs = userChatsData[cid]?.messages || {};
            if (Object.keys(msgs).length <= 1) update(ref(db, `users/${currentUserId}/chats/${cid}`), { title: txt.substring(0,25) });

            let thinkingTime = (model === 'fast') ? 500 : ((model === 'pro') ? 4000 : 1500);
            let typingSpeed = (model === 'fast') ? 10 : ((model === 'pro') ? 50 : 30);
            
            typingIndicator.classList.remove('hidden');
            typingIndicator.textContent = "CatAI печатает...";

            if (model === 'pro') {
                let step = 0;
                const interval = setInterval(() => { typingIndicator.textContent = "CatAI: " + thinkingPhrases[step++ % thinkingPhrases.length]; }, 800);
                setTimeout(() => { clearInterval(interval); finalize(); }, thinkingTime);
            } else {
                setTimeout(finalize, thinkingTime);
            }

            async function finalize() {
                let text = '';
                let prefix = model === 'base' ? '(Base ⚙️): ' : (model === 'fast' ? '(Fast ⚡): ' : `(PRO 🚀 ${subscriptionStatus.limit/1000}k): `);
                
                if (model === 'pro' && subscriptionStatus.status !== 'active') {
                    text = 'Ошибка: Нужна PRO подписка.';
                } else {
                    const answer = findBestMatch(txt, knowledgeBase);
                    text = answer ? (prefix + answer) : (prefix + 'Я не понял вопрос. Попробуйте переформулировать.');
                }

                typingIndicator.classList.add('hidden');
                const tempDiv = appendMessageToUI('ai', '');
                const contentDiv = tempDiv.querySelector('.message-content');
                
                await typeWriter(contentDiv, text, typingSpeed);
                await push(ref(db, `users/${currentUserId}/chats/${cid}/messages`), { role: 'ai', content: text });
            }
        });

        document.getElementById('new-chat-btn').addEventListener('click', createNewChat);

        // --- 7. SUBSCRIPTION ---
        function setupSubscriptionListener(uid) {
            onValue(ref(db, `users/${uid}/subscription`), s => {
                subscriptionStatus = s.val() || { status: 'none' };
                const opt = document.querySelector('option[value="pro"]');
                if(subscriptionStatus.status === 'active') { opt.disabled=false; opt.textContent=`PRO (${subscriptionStatus.limit/1000}k)`; }
                else { opt.disabled=true; opt.textContent='CatAI PRO (Нет подписки)'; }
            });
        }
        
        const modal = document.getElementById('models-modal');
        const pBtn = document.getElementById('purchase-btn');
        document.getElementById('models-btn').addEventListener('click', () => window.location.hash = '#models');
        document.getElementById('close-modal-btn').addEventListener('click', () => { window.location.hash = '#ai'; modal.classList.add('hidden'); });
        document.getElementById('close-admin-modal-btn').addEventListener('click', () => window.location.hash = '#ai');
        
        document.querySelectorAll('input[name="model-selection"]').forEach(r => r.addEventListener('change', e => {
            document.getElementById('limit-selection-fieldset').classList.toggle('hidden', e.target.value !== 'pro');
            if(e.target.value !== 'pro') { pBtn.disabled=true; pBtn.textContent='Бесплатно'; }
        }));
        document.querySelectorAll('input[name="limit-selection"]').forEach(r => r.addEventListener('change', () => { pBtn.disabled=false; pBtn.textContent='Оплатить'; }));

        pBtn.addEventListener('click', async () => {
            const m = document.querySelector('input[name="model-selection"]:checked').value;
            if(m !== 'pro') return alert('Бесплатно!');
            const lim = document.querySelector('input[name="limit-selection"]:checked').value.replace('k','') * 1000;
            document.getElementById('modal-state-waiting').classList.remove('hidden');
            document.getElementById('modal-state-default').classList.add('hidden');
            const reqRef = push(ref(db, 'purchaseRequests'));
            await set(reqRef, { userId: currentUserId, userEmail: auth.currentUser.email, model: m, limit: lim, status: 'pending', timestamp: serverTimestamp() });
            onValue(reqRef, s => {
                const d = s.val(); if(!d) return;
                if(d.status === 'confirmed') { alert('Готово!'); window.location.hash='#ai'; modal.classList.add('hidden'); document.getElementById('modal-state-waiting').classList.add('hidden'); document.getElementById('modal-state-default').classList.remove('hidden'); }
                if(d.status === 'canceled') { alert('Отказ'); document.getElementById('modal-state-waiting').classList.add('hidden'); document.getElementById('modal-state-default').classList.remove('hidden'); }
            });
        });

        function setupAdminListeners() {
            onValue(ref(db, 'purchaseRequests'), s => {
                const list = document.getElementById('admin-requests-list');
                list.innerHTML = '';
                const data = s.val() || {};
                Object.entries(data).forEach(([rid, r]) => {
                    if(r.status !== 'pending') return;
                    const div = document.createElement('div');
                    div.className = 'bg-gray-700 p-3 rounded flex justify-between items-center';
                    div.innerHTML = `<div><p class="font-bold">${r.userEmail}</p><p class="text-xs">PRO ${r.limit}</p></div><div><button class="bg-green-600 px-2 py-1 rounded text-xs mr-2" onclick="window.confirmReq('${rid}','${r.userId}','${r.model}',${r.limit})">OK</button><button class="bg-red-600 px-2 py-1 rounded text-xs" onclick="window.rejectReq('${rid}')">X</button></div>`;
                    list.appendChild(div);
                });
            });
        }
        window.confirmReq = async (rid, uid, model, limit) => { await set(ref(db, `users/${uid}/subscription`), { status: 'active', model, limit }); await update(ref(db, `purchaseRequests/${rid}`), { status: 'confirmed' }); };
        window.rejectReq = async (rid) => await update(ref(db, `purchaseRequests/${rid}`), { status: 'canceled' });
    </script>
</body>
</html>
