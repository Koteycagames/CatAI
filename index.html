        /* Global Styles */
        body {
            background: radial-gradient(circle at top left, #1a1c2c, #0f1016);
            background-size: cover;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }
        .glass {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
        }
        .glass-hover:hover {
            background: rgba(255, 255, 255, 0.08);
            border-color: rgba(255, 255, 255, 0.2);
            transform: translateY(-1px);
        }
        ul, li { list-style: none !important; margin: 0; padding: 0; }
        
        /* Custom Select */
        select {
            -webkit-appearance: none; -moz-appearance: none; appearance: none;
            background-color: rgba(0,0,0,0.3); color: white;
            text-align: center;
        }
        select option { background-color: #1f2937; color: white; padding: 10px; text-align: left; }

        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.2); border-radius: 10px; }
        .typing-cursor { display: inline-block; width: 2px; height: 1em; background-color: rgba(255,255,255,0.8); animation: blink 1s step-end infinite; vertical-align: middle; }
        @keyframes blink { 50% { opacity: 0; } }
        .fade-in { animation: fadeIn 0.3s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.15.0/firebase-app.js";
        import { getAuth, onAuthStateChanged, createUserWithEmailAndPassword, signInWithEmailAndPassword, signOut } from "https://www.gstatic.com/firebasejs/9.15.0/firebase-auth.js";
        import { getDatabase, ref, onValue, push, set, serverTimestamp, update, off, get } from "https://www.gstatic.com/firebasejs/9.15.0/firebase-database.js";

        const API_KEY = "gsk_cOdfx6XLeTHQbSsd32qCW" + "Gdyb3FYDnTmtayoP131UKN7zwEeqG3K"; 

        const firebaseConfig = {
            apiKey: "AIzaSyCcgLac2riawIGPHsdkXLOeFTEY_TUZX_s",
            authDomain: "catai-1624d.firebaseapp.com",
            databaseURL: "https://catai-1624d-default-rtdb.firebaseio.com",
            projectId: "catai-1624d",
            storageBucket: "catai-1624d.firebasestorage.app",
            messagingSenderId: "565260079109",
            appId: "1:565260079109:web:fd10c337a424555c0b0c6c"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getDatabase(app);

        const pages = document.querySelectorAll('.page');
        const chatHistoryList = document.getElementById('chat-history-list');
        const chatMessages = document.getElementById('chat-messages');
        const typingIndicator = document.getElementById('typing-indicator');
        const offlineScreen = document.getElementById('server-offline-screen');
        const offlineReasonText = document.getElementById('offline-reason');
        
        let currentUserId = null;
        let isAdmin = false;
        let userChatsData = {};
        let currentActiveChatId = null;
        let knowledgeBase = {};
        let subscriptionStatus = { status: 'none' };
        const thinkingPhrases = ["Подключение...", "Анализ...", "Генерация..."];

        function setupServerStatusListener() {
            onValue(ref(db, 'serverStatus'), (snapshot) => {
                const status = snapshot.val();
                if (!status) return; 
                if (status.isOnline === false) {
                    if (isAdmin) { offlineScreen.classList.add('hidden'); } 
                    else {
                        offlineReasonText.textContent = status.reason || "Ошибка подключения.";
                        offlineScreen.classList.remove('hidden'); offlineScreen.classList.add('flex');
                    }
                } else { offlineScreen.classList.add('hidden'); offlineScreen.classList.remove('flex'); }
            });
        }

        async function askAI(userMessage) {
            const url = "https://api.groq.com/openai/v1/chat/completions";
            const requestBody = {
                model: "llama-3.3-70b-versatile",
                messages: [
                    { role: "system", content: "Ты — CatAI, умный помощник. Отвечай на русском. ВАЖНО: Если сообщение содержит мат/оскорбления, отвечай ТОЛЬКО: 'Я не могу ответить на ваше сообщение из-за содержания некорректных выражений'." },
                    { role: "user", content: userMessage }
                ]
            };
            try {
                const response = await fetch(url, {
                    method: "POST",
                    headers: { "Content-Type": "application/json", "Authorization": `Bearer ${API_KEY}` },
                    body: JSON.stringify(requestBody)
                });
                const data = await response.json();
                if (data.error) return "Ошибка мозга: " + data.error.message;
                return data.choices[0].message.content;
            } catch (e) { return "Ошибка сети. Сервер не отвечает."; }
        }

        const ACTION_WORDS = new Set(['как', 'сделать', 'приготовить', 'сварить', 'пожарить', 'рецепт', 'что', 'такое', 'зачем', 'почему', 'какой', 'при', 'на', 'в', 'с']);
        function cleanString(str) { return str.toLowerCase().trim().replace(/[\?\!\.\,\(\)\-\:]/g, ''); }
        function levenshtein(a, b) {
            if (a.length === 0) return b.length; if (b.length === 0) return a.length;
            const matrix = []; for (let i = 0; i <= b.length; i++) matrix[i] = [i]; for (let j = 0; j <= a.length; j++) matrix[0][j] = j;
            for (let i = 1; i <= b.length; i++) { for (let j = 1; j <= a.length; j++) { const cost = (b.charAt(i - 1) === a.charAt(j - 1)) ? 0 : 1; matrix[i][j] = Math.min(matrix[i - 1][j - 1] + cost, matrix[i][j - 1] + 1, matrix[i - 1][j] + 1); } }
            return matrix[b.length][a.length];
        }
        function findBestMatch(userInput, db) {
            const userWords = cleanString(userInput).split(/\s+/).filter(w => w.length > 1);
            let bestMatchKey = null, maxScore = 0;
            for (const dbKey in db) {
                const dbWords = cleanString(dbKey).split(/\s+/);
                let currentScore = 0;
                userWords.forEach(uWord => {
                    dbWords.forEach(dbWord => {
                        let wordScore = 0;
                        const isAction = ACTION_WORDS.has(uWord) || ACTION_WORDS.has(dbWord);
                        const weight = isAction ? 2 : 20; 
                        if (uWord === dbWord) wordScore = weight; 
                        else if (uWord.length > 3 && dbWord.length > 3) {
                            if (dbWord.startsWith(uWord) || uWord.startsWith(dbWord)) wordScore = weight * 0.8; 
                            else if (levenshtein(uWord, dbWord) <= 1) wordScore = weight * 0.65;
                        }
                        if(wordScore > 0) currentScore += wordScore;
                    });
                });
                const lengthDiff = Math.abs(userWords.length - dbWords.length);
                currentScore -= lengthDiff * 0.2;
                if (currentScore > maxScore) { maxScore = currentScore; bestMatchKey = dbKey; }
            }
            if (maxScore >= 9) return db[bestMatchKey];
            return null;
        }

        async function loadKnowledgeBase() {
            const files = ['chat.json', 'cooking.json', 'technics.json', 'programm.json'];
            knowledgeBase = {};
            const ts = new Date().getTime();
            for (const file of files) { try { const r = await fetch(file + '?v=' + ts); if (!r.ok) continue; const d = await r.json(); for (let k in d) knowledgeBase[k.toLowerCase().trim()] = d[k]; } catch (e) {} }
        }

        function updateView() {
            const hash = window.location.hash || (currentUserId ? '#ai' : '#login');
            pages.forEach(p => p.classList.add('hidden'));
            if (hash === '#ai' && currentUserId) document.querySelector('#ai').classList.remove('hidden');
            else if (hash === '#models') { document.querySelector('#ai').classList.remove('hidden'); document.getElementById('models-modal').classList.remove('hidden'); }
            else if (hash === '#admin' && isAdmin) { document.querySelector('#ai').classList.remove('hidden'); document.getElementById('admin-modal').classList.remove('hidden'); }
            else if (hash === '#register') document.querySelector('#register').classList.remove('hidden');
            else document.querySelector('#login').classList.remove('hidden');
        }
        window.addEventListener('hashchange', updateView);

        onAuthStateChanged(auth, async (user) => {
            currentUserId = user ? user.uid : null;
            if (user) {
                isAdmin = (user.email === 'admin@gmail.com');
                document.getElementById('admin-panel-btn').classList.toggle('hidden', !isAdmin);
                await loadKnowledgeBase();
                setupChatListeners(user.uid);
                setupSubscriptionListener(user.uid);
                setupServerStatusListener();
                if(isAdmin) setupAdminListeners();
                if(!window.location.hash || window.location.hash === '#login') window.location.hash = '#ai';
            } else {
                window.location.hash = '#login';
                chatHistoryList.innerHTML = '';
                chatMessages.innerHTML = '';
            }
            updateView();
        });

        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            try { await signInWithEmailAndPassword(auth, document.getElementById('login-email').value, document.getElementById('login-password').value); } 
            catch (e) { document.getElementById('login-error').textContent = e.code==='auth/wrong-password'?'Неверный пароль':e.message; }
        });
        document.getElementById('register-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            if(document.getElementById('register-password').value !== document.getElementById('register-password-confirm').value) return alert('Пароли не совпадают');
            try { await createUserWithEmailAndPassword(auth, document.getElementById('register-email').value, document.getElementById('register-password').value); window.location.hash = '#login'; } 
            catch (e) { document.getElementById('register-error').textContent = e.message; }
        });
        document.getElementById('logout-btn').addEventListener('click', () => signOut(auth));

        function setupChatListeners(uid) {
            onValue(ref(db, `users/${uid}/chats`), (snap) => {
                userChatsData = snap.val() || {};
                if (currentActiveChatId && !userChatsData[currentActiveChatId]) currentActiveChatId = null;
                if (!currentActiveChatId && Object.keys(userChatsData).length > 0) currentActiveChatId = Object.keys(userChatsData).pop();
                renderSidebar(userChatsData);
                if (currentActiveChatId && userChatsData[currentActiveChatId]) renderChat(userChatsData[currentActiveChatId]);
            });
        }

        async function createNewChat() {
            if(!currentUserId) return;
            const newRef = push(ref(db, `users/${currentUserId}/chats`));
            const newId = newRef.key;
            currentActiveChatId = newId;
            await set(newRef, { title: 'Новый чат', createdAt: serverTimestamp(), messages: {} });
            push(ref(db, `users/${currentUserId}/chats/${newId}/messages`), {role: 'ai', content: 'Привет! Я CatAI.'});
            userChatsData[newId] = { title: 'Новый чат', messages: {} };
            renderSidebar(userChatsData);
            chatMessages.innerHTML = '';
        }

        function renderSidebar(data) {
            chatHistoryList.innerHTML = '';
            Object.keys(data).reverse().forEach(id => {
                const chat = data[id];
                const li = document.createElement('li');
                const a = document.createElement('a');
                a.href = '#';
                a.textContent = chat.title || 'Чат';
                const isActive = id === currentActiveChatId;
                a.className = `block w-full text-left px-4 py-3 text-sm rounded-xl truncate transition duration-200 ${isActive ? 'bg-white/10 text-white border-l-2 border-blue-400 font-medium' : 'text-gray-400 hover:bg-white/5 hover:text-gray-200'}`;
                a.onclick = (e) => { 
                    e.preventDefault(); currentActiveChatId = id; renderSidebar(userChatsData); renderChat(userChatsData[id]); 
                };
                li.appendChild(a);
                chatHistoryList.appendChild(li);
            });
        }

        function renderChat(chat) {
            chatMessages.innerHTML = '';
            if(!chat || !chat.messages) return;
            Object.values(chat.messages).forEach(msg => appendMessageToUI(msg.role, msg.content));
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        function appendMessageToUI(role, content) {
            const isUser = role === 'user';
            const div = document.createElement('div');
            div.className = `flex items-start space-x-3 mb-6 fade-in ${isUser ? 'flex-row-reverse space-x-reverse' : ''}`;
            div.innerHTML = `
                <div class="flex-shrink-0 w-10 h-10 rounded-full ${isUser ? 'bg-gradient-to-br from-blue-500 to-purple-500' : 'bg-white/10'} flex items-center justify-center text-white text-sm font-bold shadow-lg border border-white/10">${isUser?'U':'AI'}</div>
                <div class="max-w-[80%] min-w-[100px]">
                    <div class="p-4 rounded-2xl ${isUser ? 'bg-gradient-to-r from-blue-600 to-blue-500 text-white rounded-tr-sm shadow-blue-500/20' : 'glass text-gray-100 rounded-tl-sm'} text-sm leading-relaxed whitespace-pre-wrap break-words shadow-md border border-white/5 message-content">${content}</div>
                </div>`;
            chatMessages.appendChild(div);
            return div;
        }

        function typeWriter(element, text, speed) {
            return new Promise(resolve => {
                let i = 0; element.innerHTML = '<span class="typing-cursor"></span>';
                function type() {
                    if (i < text.length) {
                        const char = text.charAt(i);
                        let currentHTML = element.innerHTML.replace('<span class="typing-cursor"></span>', '');
                        if (char === '<') { let tag = ''; while (text.charAt(i) !== '>' && i < text.length) { tag += text.charAt(i); i++; } tag += '>'; i++; currentHTML += tag; } 
                        else { currentHTML += char; i++; }
                        element.innerHTML = currentHTML + '<span class="typing-cursor"></span>';
                        chatMessages.scrollTop = chatMessages.scrollHeight;
                        setTimeout(type, speed);
                    } else { element.innerHTML = element.innerHTML.replace('<span class="typing-cursor"></span>', ''); resolve(); }
                }
                type();
            });
        }

        document.getElementById('chat-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const txt = document.getElementById('chat-input').value.trim();
            if(!txt) return;
            if(!currentActiveChatId) await createNewChat();
            
            const cid = currentActiveChatId;
            const model = document.getElementById('model-select').value;
            const source = document.getElementById('source-select').value;
            document.getElementById('chat-input').value = '';

            await push(ref(db, `users/${currentUserId}/chats/${cid}/messages`), { role: 'user', content: txt });
            const msgs = userChatsData[cid]?.messages || {};
            if (Object.keys(msgs).length <= 1) update(ref(db, `users/${currentUserId}/chats/${cid}`), { title: txt.substring(0,25) });

            let thinkingTime = (model === 'fast') ? 500 : ((model === 'pro') ? 1000 : 1500);
            let typingSpeed = (model === 'fast') ? 10 : ((model === 'pro') ? 20 : 30);
            
            typingIndicator.classList.remove('hidden');
            const typingText = document.getElementById('typing-text');
            typingText.textContent = "CatAI печатает...";

            if (model === 'pro') {
                let step = 0;
                const interval = setInterval(() => { typingText.textContent = thinkingPhrases[step++ % thinkingPhrases.length]; }, 800);
                setTimeout(() => { clearInterval(interval); finalize(); }, thinkingTime);
            } else { setTimeout(finalize, thinkingTime); }

            async function finalize() {
                let text = '';
                let prefix = model === 'base' ? '' : (model === 'fast' ? '⚡ ' : `🚀 `);
                
                // === LOGIC OF SOURCE SELECTION ===
                if (source === 'json') {
                    // ONLY LOCAL
                    const localAnswer = findBestMatch(txt, knowledgeBase);
                    text = localAnswer ? (prefix + localAnswer) : (prefix + 'Я не понял вопрос.');
                
                } else if (source === 'ai') {
                    // ONLY AI (GROQ)
                    document.getElementById('typing-text').textContent = "Генерация ответа...";
                    const aiAnswer = await askAI(txt);
                    text = prefix + aiAnswer;
                
                } else {
                    // HYBRID (JSON -> AI)
                    const localAnswer = findBestMatch(txt, knowledgeBase);
                    if (localAnswer) {
                        text = prefix + localAnswer;
                    } else {
                        document.getElementById('typing-text').textContent = "Генерация ответа...";
                        const aiAnswer = await askAI(txt);
                        text = prefix + aiAnswer;
                    }
                }

                typingIndicator.classList.add('hidden');
                const tempDiv = appendMessageToUI('ai', '');
                const contentDiv = tempDiv.querySelector('.message-content');
                if (text.length > 300) typingSpeed = 5;
                await typeWriter(contentDiv, text, typingSpeed);
                await push(ref(db, `users/${currentUserId}/chats/${cid}/messages`), { role: 'ai', content: text });
            }
        });

        document.getElementById('new-chat-btn').addEventListener('click', createNewChat);

        function setupSubscriptionListener(uid) {
            onValue(ref(db, `users/${uid}/subscription`), s => {
                subscriptionStatus = s.val() || { status: 'none' };
                const opt = document.querySelector('option[value="pro"]');
                if(subscriptionStatus.status === 'active') { opt.disabled=false; opt.textContent=`CatAI PRO (AI)`; }
                else { opt.disabled=true; opt.textContent='CatAI PRO (Locked)'; }
            });
        }
        
        const modelsModal = document.getElementById('models-modal');
        const adminModal = document.getElementById('admin-modal');
        document.getElementById('models-btn').addEventListener('click', () => window.location.hash = '#models');
        document.getElementById('admin-panel-btn').addEventListener('click', () => window.location.hash = '#admin');
        document.getElementById('close-modal-btn').addEventListener('click', () => { window.location.hash = '#ai'; modelsModal.classList.add('hidden'); });
        document.getElementById('close-admin-modal-btn').addEventListener('click', () => { window.location.hash = '#ai'; adminModal.classList.add('hidden'); });

        document.querySelectorAll('input[name="model-selection"]').forEach(r => r.addEventListener('change', e => {
            const fs = document.getElementById('limit-selection-fieldset');
            if(fs) fs.classList.toggle('hidden', e.target.value !== 'pro');
            const btn = document.getElementById('purchase-btn');
            if(btn && e.target.value !== 'pro') { btn.disabled=true; btn.textContent='Бесплатно'; }
        }));
        
        document.querySelectorAll('input[name="limit-selection"]').forEach(r => r.addEventListener('change', () => { 
            const btn = document.getElementById('purchase-btn'); 
            if(btn) { btn.disabled=false; btn.textContent='Оплатить'; }
        }));

        const purchaseBtn = document.getElementById('purchase-btn');
        if(purchaseBtn) {
            purchaseBtn.addEventListener('click', async () => {
                const m = document.querySelector('input[name="model-selection"]:checked').value;
                if(m !== 'pro') return alert('Это бесплатно!');
                const lim = document.querySelector('input[name="limit-selection"]:checked').value.replace('k','') * 1000;
                document.getElementById('modal-state-waiting').classList.remove('hidden');
                document.getElementById('modal-state-default').classList.add('hidden');
                const reqRef = push(ref(db, 'purchaseRequests'));
                await set(reqRef, { userId: currentUserId, userEmail: auth.currentUser.email, model: m, limit: lim, status: 'pending', timestamp: serverTimestamp() });
                onValue(reqRef, s => {
                    const d = s.val(); if(!d) return;
                    if(d.status === 'confirmed') { alert('Подписка активна!'); window.location.hash='#ai'; modelsModal.classList.add('hidden'); window.location.reload(); }
                });
            });
        }

        // TABS
        const tabReqBtn = document.getElementById('tab-requests-btn');
        const tabMgmtBtn = document.getElementById('tab-management-btn');
        const tabReqContent = document.getElementById('tab-requests-content');
        const tabMgmtContent = document.getElementById('tab-management-content');

        if(tabReqBtn && tabMgmtBtn) {
            tabReqBtn.onclick = () => {
                tabReqContent.classList.remove('hidden'); tabMgmtContent.classList.add('hidden');
                tabReqBtn.classList.add('border-b-2', 'border-blue-500', 'bg-white/5', 'text-white'); tabReqBtn.classList.remove('text-gray-400');
                tabMgmtBtn.classList.remove('border-b-2', 'border-blue-500', 'bg-white/5', 'text-white'); tabMgmtBtn.classList.add('text-gray-400');
            };
            tabMgmtBtn.onclick = () => {
                tabReqContent.classList.add('hidden'); tabMgmtContent.classList.remove('hidden');
                tabMgmtBtn.classList.add('border-b-2', 'border-blue-500', 'bg-white/5', 'text-white'); tabMgmtBtn.classList.remove('text-gray-400');
                tabReqBtn.classList.remove('border-b-2', 'border-blue-500', 'bg-white/5', 'text-white'); tabReqBtn.classList.add('text-gray-400');
            };
        }

        function setupAdminListeners() {
            onValue(ref(db, 'purchaseRequests'), s => {
                const list = document.getElementById('admin-requests-list');
                list.innerHTML = '';
                const data = s.val() || {};
                Object.entries(data).forEach(([rid, r]) => {
                    if(r.status !== 'pending') return;
                    const div = document.createElement('div');
                    div.className = 'glass p-4 rounded-xl flex justify-between items-center border-white/10';
                    div.innerHTML = `<div><p class="font-bold text-white">${r.userEmail}</p><p class="text-xs text-blue-400">PRO ${r.limit}</p></div>
                        <div class="space-x-2"><button class="bg-green-600 hover:bg-green-500 text-white px-3 py-1 rounded-lg text-sm transition" onclick="window.confirmReq('${rid}','${r.userId}','${r.model}',${r.limit})">✔</button><button class="bg-red-600 hover:bg-red-500 text-white px-3 py-1 rounded-lg text-sm transition" onclick="window.rejectReq('${rid}')">✖</button></div>`;
                    list.appendChild(div);
                });
            });
        }

        // GLOBAL ADMIN FUNCTIONS
        window.adminCrashServer = async (reason) => {
            if(confirm(`ПОЛОЖИТЬ сервер с причиной: "${reason}"?`)) await set(ref(db, 'serverStatus'), { isOnline: false, reason: reason });
        };
        window.adminDisconnectServer = async () => {
            if(confirm('Отключить доступ?')) await set(ref(db, 'serverStatus'), { isOnline: false, reason: 'Ошибка подключения к серверу. Повторите попытку позже.' });
        };
        window.adminReviveServer = async () => { await set(ref(db, 'serverStatus'), { isOnline: true, reason: '' }); };

        window.confirmReq = async (rid, uid, model, limit) => { await set(ref(db, `users/${uid}/subscription`), { status: 'active', model, limit }); await update(ref(db, `purchaseRequests/${rid}`), { status: 'confirmed' }); };
        window.rejectReq = async (rid) => await update(ref(db, `purchaseRequests/${rid}`), { status: 'canceled' });

    </script>
</body>
</html>
